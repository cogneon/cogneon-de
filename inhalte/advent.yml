# Wissensmanagement-Adventskalender auf /advent/
#
# Ein Türchen öffnet sich ab seinem Tag (Zeitzone Europe/Berlin), sobald der
# tägliche Build läuft (03:23 UTC). Vorher steht nur eine geschlossene Kachel
# auf der Seite, der Inhalt ist nicht im HTML.
#
# Ein Türchen erscheint nur, wenn titel, link und warum ausgefüllt sind. Ist es
# an seinem Tag noch unvollständig, bleibt es geschlossen und der Build meldet es.
#
# ACHTUNG: Diese Datei ist im öffentlichen Repository lesbar. Wer hier
# nachschaut, sieht künftige Türchen schon vorher.
#
# Felder je Türchen:
#   tag     1-24
#   typ     Video, Paper, Buch, Blog, Podcast, Werkzeug, Methode, Leitfaden ...
#   titel   Titel der Empfehlung
#   link    https-Adresse (Videos nur verlinken, nicht einbetten)
#   von     optional: Autor:in, Verlag oder Quelle
#   warum   2-3 Sätze: warum genau diese Empfehlung
#   impuls  optional: eine Frage oder ein Mini-Experiment für heute

jahr: 2026

# Thema ab dem jeweiligen Tag (Adventswochen)
themen:
  - {ab: 1, titel: Wissen sichern}
  - {ab: 6, titel: Wissen teilen}
  - {ab: 13, titel: Lernen in Organisationen}
  - {ab: 20, titel: KI und Wissen}

tuerchen:
  - tag: 1
    typ: Video
    titel: Wissensmanagement einfach erklärt
    link: https://www.youtube.com/watch?v=uz0KXaflY2w
    von: Patrick Lambe
    warum: Das Video zeigt eine ironische Sicht auf Wissensmanagement in Organisationen ... oft gar nicht so weit von der Realität entfernt!
    impuls: Wie erklärst du Wissensmanagement in 2-3 Sätzen? Schreibe in der Community oder sozialen Netzwerken und teile den Link zu diesem Adventskalender 🙏
