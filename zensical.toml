# Konfiguration der Cogneon-Website (https://cogneon.de)
# Doku: https://zensical.org/docs/

[project]
site_name = "Cogneon"
site_url = "https://cogneon.de/"
site_description = "Cogneon - Wissensmanagement und Lernende Organisation"
site_author = "Cogneon GmbH"
copyright = "Cogneon GmbH"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
language = "de"
logo = "assets/logo.svg"
# Keine Schriften von Drittanbietern laden (kein Cookie-Banner noetig).
font = false
features = [
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

# Light/Dark-Mode: folgt dem System, per Schalter umstellbar.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Helles Design"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Dunkles Design"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Systemeinstellung"

# Blog. Die Beitraege liegen wie in WordPress unter /JJJJ/MM/TT/titel/.
# Dafuer ist das Blog an der Wurzel der Website eingehaengt (blog_dir = "."),
# die Dateien selbst liegen in docs/blog/posts/.
[project.plugins.blog]
blog_dir = "."
post_dir = "blog/posts"
post_url_format = "{date}/{slug}"
authors_profiles = true
pagination_per_page = 10

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
