# Konfiguration der Cogneon-Website (https://cogneon.de)
# Doku: https://zensical.org/docs/

[project]
site_name = "Cogneon"
site_url = "https://cogneon.de/"
site_description = "Cogneon - Wissensmanagement und Lernende Organisation"
site_author = "Cogneon GmbH"
copyright = "Cogneon GmbH - The Knowledge Company"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["assets/stylesheets/cogneon.css"]
extra_javascript = ["assets/javascripts/karte.js", "assets/javascripts/mail.js"]

# Seitenmenü (mobil) und Reihenfolge der Seiten. Das Menü in der Kopfzeile
# steht unter [project.extra] weiter unten.
nav = [
  { "Startseite" = "index.md" },
  { "Angebote" = [
    "angebote.md",
    "wissenstransfer.md",
    "expert-debriefing.md",
  ] },
  { "Bausteine" = "bausteine.md" },
]

[project.theme]
language = "de"
custom_dir = "overrides"
# Kopfzeile ist immer dunkel, deshalb das helle Logo.
logo = "assets/logo-hell.svg"
favicon = "assets/favicon.svg"
# Keine Schriften von Drittanbietern laden. Die Schriften liegen lokal
# unter docs/assets/fonts und werden in cogneon.css eingebunden.
font = false
features = [
  "announce.dismiss",
  "content.tooltips",
  "navigation.indexes",
  "navigation.top",
  "search.highlight",
]

# Light/Dark-Mode: folgt dem System, per Schalter umstellbar.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Helles Design"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Dunkles Design"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Systemeinstellung"

# Blog. Die Beitraege liegen wie in WordPress unter /JJJJ/MM/TT/titel/.
# Dafuer ist das Blog an der Wurzel der Website eingehaengt (blog_dir = "."),
# die Dateien selbst liegen in docs/blog/posts/.
[project.plugins.blog]
blog_dir = "."
post_dir = "blog/posts"
post_url_format = "{date}/{slug}"
authors_profiles = true
# Die Übersicht unter /blog/ baut scripts/build_data.py, deshalb erzeugt das
# Blog selbst keine Übersichtsseiten (/page/2/ ...).
pagination = false
# Jahresarchive wie in WordPress unter /JJJJ/.
archive_url_format = "{date}"
categories_pagination_per_page = 20
authors_profiles_pagination_per_page = 20
archive_pagination_per_page = 20

# Daten aus _data/*.yml stehen in den Vorlagen als config.extra.<datei> bereit.
[project.plugins.markdownextradata]
data = "_data"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true

# Menü der Kopfzeile und Angaben für die Fußzeile.
[project.extra]
erstgespraech = "kontakt/#erstgespraech"
community = "https://community.cogneon.de/"
community_kalender = "https://community.cogneon.de/t/community-kalender-2024/3868"

# Matomo: dieselbe Site-ID wie unter WordPress, damit die Statistik
# durchgehend vergleichbar bleibt. Gezählt wird nur auf den genannten Adressen.
[project.extra.matomo]
url = "https://analytics.cogneon.de/"
site_id = "1"
hosts = ["cogneon.de", "www.cogneon.de"]


[[project.extra.menu]]
titel = "Angebote"
url = "angebote/"

[[project.extra.menu]]
titel = "Akademie"
url = "akademie/"

[[project.extra.menu]]
titel = "Blog"
url = "blog/"

[[project.extra.menu]]
titel = "Termine"
url = "events/"

[[project.extra.menu]]
titel = "Über uns"
url = "ueber-uns/"

# Englisches Hauptmenü für Seiten unter /en/. Ziele ohne englische
# Fassung (Blog, Termine) bleiben deutsch und tragen nur_de = true: Im Menü
# steht dann ein kleines "DE".
[[project.extra.menu_en]]
titel = "Services"
url = "en/services/"

[[project.extra.menu_en]]
titel = "Academy"
url = "en/academy/"

[[project.extra.menu_en]]
titel = "Blog"
url = "blog/"
nur_de = true

[[project.extra.menu_en]]
titel = "Events"
url = "events/"
nur_de = true

[[project.extra.menu_en]]
titel = "About us"
url = "en/about/"
