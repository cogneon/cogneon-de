{#- Abschlussblock jeder Angebotsseite. Felder: cta.titel, cta.text, cta.betreff -#}
{% set cta = page.meta.cta | d({}) %}
<section class="cg-section cg-section--dunkel" id="erstgespraech">
  <div class="cg-wrap cg-stack">
    <h2 class="cg-h2 cg-h2--gross">{{ cta.titel | d("Lasst uns sprechen.") }}</h2>
    <p class="cg-lead">{{ cta.text | d("Im Erstgespräch klären wir, worum es geht und was passt. 30 Minuten, kostenlos.") }}</p>
    <p><a class="cg-button" href="mailto:info@cogneon.de?subject={{ (cta.betreff | d('Erstgespräch')) | urlencode }}">Erstgespräch anfragen</a></p>
  </div>
</section>
