name: WordPress-Export

# Liest cogneon.de über die REST-API aus. Das Ergebnis landet auf einem Branch
# (Pilot: export/ergebnis, sonst export/voll - wird bei jedem Lauf überschrieben)
# und als Artefakt am Lauf.
# main bleibt unberührt - übernommen wird per Pull Request.
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "inventar = nur zählen, pilot = begrenzte Anzahl, voll = alles"
        type: choice
        options: [inventar, pilot, voll]
        default: inventar
      limit:
        description: "Anzahl Einträge je Typ im Pilot"
        default: "10"
      medien:
        description: "Medien herunterladen"
        type: boolean
        default: true
  # Erster Testlauf beim Aufsetzen. Kann nach dem Merge entfernt werden.
  push:
    branches: ["setup/**"]
    paths: [".github/workflows/export.yml", "scripts/wp_export.py"]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Bei Push steuert die Commit-Nachricht den Lauf: [voll] und [ohne-medien].
      MODUS: ${{ inputs.modus || (contains(github.event.head_commit.message, '[voll]') && 'voll' || 'pilot') }}
      LIMIT: ${{ inputs.limit || '10' }}
      MEDIEN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.medien == false) || contains(github.event.head_commit.message, '[ohne-medien]')) && 'nein' || 'ja' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS=""
          if [ "$MODUS" = "inventar" ]; then ARGS="--inventory-only"; fi
          if [ "$MODUS" = "pilot" ]; then ARGS="--limit $LIMIT --raw"; fi
          if [ "$MODUS" = "voll" ]; then ARGS="--raw"; fi
          if [ "$MEDIEN" = "nein" ]; then ARGS="$ARGS --no-media"; fi
          python scripts/wp_export.py $ARGS
      - name: Alte URLs aus der Sitemap sichern
        if: always()
        run: python scripts/check_urls.py --sitemap https://cogneon.de/wp-sitemap.xml --save-list migration/old-urls.txt --report-only || true
      - name: Bericht
        if: always()
        run: |
          cat migration/report.md | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "## Alte URLs laut Sitemap: $(wc -l < migration/old-urls.txt 2>/dev/null || echo 0)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Verteilung nach erstem Pfadabschnitt"
          sed -E 's#https?://[^/]+/##' migration/old-urls.txt | awk -F/ '{print $1}' | sort | uniq -c | sort -rn | head -40 || true
          echo "### Beispiel-URLs von Beiträgen"
          grep -E '/(19|20)[0-9]{2}/' migration/old-urls.txt | head -5 || true
          echo "### Medien"
          du -sh docs/wp-content 2>/dev/null || echo "keine Medien geladen"
          find docs/wp-content -type f 2>/dev/null | wc -l
      - name: Probe-Build mit exportierten Inhalten
        if: env.MODUS != 'inventar'
        run: |
          python scripts/build_data.py
          zensical build
          python scripts/check_urls.py --url-map migration/url-map.csv --report-only
      - name: Medien verkleinern
        if: (!cancelled()) && env.MODUS != 'inventar' && env.MEDIEN == 'ja'
        run: python scripts/optimize_media.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis auf Branch ablegen (Pilot export/ergebnis, sonst export/voll)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ZIEL=export/ergebnis; if [ "$MODUS" != "pilot" ]; then ZIEL=export/voll; fi
          git checkout -q -B "$ZIEL"
          # Medien liegen unter ihren alten Pfaden im Repository. Obergrenze als
          # Schutz, falls der Bestand unerwartet wächst.
          MB=$(du -sm docs/wp-content 2>/dev/null | cut -f1 || echo 0)
          if [ "${MB:-0}" -le 300 ]; then git add -A docs; else git add -A docs ':!docs/wp-content'; echo "Medien nicht übernommen: ${MB} MB" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          git add -A migration
          git add -f migration/raw 2>/dev/null || true
          git commit -q -m "WordPress-Export: Modus $MODUS, $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nichts zu committen"
          git push -q --force origin "$ZIEL"
      - name: Übernahme für main vorbereiten (Branch inhalt/aus-export)
        # Enthält nur Inhalte, Medien und Migrationsdaten auf dem Stand von main.
        # Daraus wird ein Pull Request gestellt.
        if: (!cancelled()) && env.MODUS == 'voll'
        run: |
          git fetch -q origin main
          git checkout -q -B inhalt/aus-export FETCH_HEAD
          git checkout export/voll -- docs/blog/posts docs/.authors.yml migration ':(exclude)migration/raw'
          git ls-tree --name-only export/voll docs/ | grep '\.md$' | xargs -r git checkout export/voll --
          if git cat-file -e export/voll:docs/wp-content 2>/dev/null; then git checkout export/voll -- docs/wp-content; fi
          git commit -q -m "Inhalte und Medien aus WordPress, Export vom $(date -u +%d.%m.%Y)" || echo "nichts zu übernehmen"
          git push -q --force origin inhalt/aus-export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-export
          path: |
            migration
            docs
            !docs/wp-content/**
          include-hidden-files: true
          retention-days: 14
