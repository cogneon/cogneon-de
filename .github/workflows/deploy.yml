name: Veröffentlichen

# Baut die Website und lädt sie per SFTP auf den Webspace (Ionos).
#   - bei jedem Merge nach main
#   - jeden Abend (22:17 MEZ): öffnet das nächste Türchen des Adventskalenders
#     (gilt ab 18 Uhr als Folgetag, siehe ADVENT_VORLAUF in build_data.py);
#     GitHub verzögert geplante Läufe oft um Stunden
#   - jeden Morgen, damit vergangene Termine ins Archiv wandern und
#     Highlights mit Ablaufdatum verschwinden
#   - von Hand: Actions -> Veröffentlichen -> Run workflow
# Zugangsdaten stehen als Secrets im Repository: SFTP_HOST, SFTP_USER,
# SFTP_PASSWORD, SFTP_PATH (Zielordner auf dem Webspace).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python scripts/build_data.py
      - run: zensical build
      - name: Alte Adressen prüfen
        run: python scripts/check_urls.py --url-map migration/url-map.csv --url-list migration/old-urls.txt --report-only
      - name: Server-Regeln und Weiterleitungen erzeugen
        run: python scripts/build_htaccess.py
      - name: Hochladen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASSWORD" ] || [ -z "$SFTP_PATH" ]; then
            echo "Zugangsdaten fehlen (SFTP_HOST, SFTP_USER, SFTP_PASSWORD, SFTP_PATH). Nichts hochgeladen." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          sudo apt-get install -y -qq lftp > /dev/null
          date -u +"%Y-%m-%d %H:%M UTC, Commit ${GITHUB_SHA::7}" > site/.cogneon-de-deploy
          export LFTP_PASSWORD="$SFTP_PASSWORD"
          VERBINDUNG="set sftp:auto-confirm yes; set sftp:connect-program 'ssh -a -x -o ConnectTimeout=20 -o ServerAliveInterval=15'; set net:max-retries 2; set net:timeout 20; set net:reconnect-interval-base 5; set cmd:fail-exit yes; open --env-password -u $SFTP_USER sftp://$SFTP_HOST"

          echo "Verbindung testen ..."
          if ! timeout 90 lftp -c "$VERBINDUNG; cls -1 /" > /dev/null; then
            echo "Keine Verbindung zum Server oder Anmeldung abgelehnt. Bitte SFTP_HOST (nur der Servername), SFTP_USER und SFTP_PASSWORD prüfen." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Gelöscht wird auf dem Server nur, wenn dort schon ein Stand dieser Website
          # liegt (Markierungsdatei). So kann ein falsch gesetzter Pfad nichts Fremdes löschen.
          if timeout 60 lftp -c "$VERBINDUNG; cat $SFTP_PATH/.cogneon-de-deploy" > /dev/null 2>&1; then
            LOESCHEN="--delete"
          else
            LOESCHEN=""
            echo "Erster Upload in diesen Ordner: auf dem Server wird nichts gelöscht." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # Zuerst Seiten, Stile und Skripte (jedes Mal vollständig), dann die Medien
          # (nur neue oder in der Größe geänderte Dateien). Die Markierungsdatei kommt
          # zuletzt, damit ein abgebrochener Upload nicht als vollständig gilt.
          mv site/.cogneon-de-deploy /tmp/marke
          lftp -c "$VERBINDUNG; mkdir -p -f $SFTP_PATH;
            mirror -R $LOESCHEN --verbose=1 --parallel=4 --no-perms --exclude-glob wp-content/ --exclude-glob .cogneon-de-deploy site $SFTP_PATH;
            mirror -R $LOESCHEN --verbose=1 --parallel=4 --ignore-time --no-perms site/wp-content $SFTP_PATH/wp-content;
            put -O $SFTP_PATH /tmp/marke -o .cogneon-de-deploy" | tail -n 40
          echo "Hochgeladen: $(find site -type f | wc -l) Dateien, $(du -sh site | cut -f1)." | tee -a "$GITHUB_STEP_SUMMARY"
