name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Daten für die Startseite erzeugen
        run: python scripts/build_data.py
      - name: Vorschaubilder für soziale Netzwerke
        run: python scripts/build_social.py
      - name: Website bauen
        run: zensical build
      - name: URL-Check (alte URLs müssen erreichbar bleiben)
        run: python scripts/check_urls.py --url-map migration/url-map.csv --url-list migration/old-urls.txt --report-only
      - name: Linkprüfung (interne Links, ohne fremde Websites)
        run: python scripts/check_links.py --report-only
      # Nur die Prüfberichte aufheben (wenige KB). Die gebaute Website (rund
      # 60 MB je Lauf) wird nicht mehr hochgeladen: Sie sprengte das
      # Speicherkontingent für Actions und lässt sich jederzeit lokal bauen.
      - uses: actions/upload-artifact@v4
        with:
          name: pruefberichte
          path: |
            migration/url-check.md
            migration/link-check.md
          retention-days: 3
